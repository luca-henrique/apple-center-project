name: Docker Compose Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create mock environment files
        run: |
          touch .env
          echo "TUNNEL_TOKEN=dummy_token_for_validation" >> .env
          touch frontend-apple-center/.env
          echo "PORT=3000" >> frontend-apple-center/.env

      - name: Create mock external docker network
        run: |
          docker network create cloudflare_tunnel_network

      - name: Validate Docker Compose Config
        run: |
          docker compose config
